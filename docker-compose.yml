services:
  db:
    image: postgres:16
    container_name: pg-meteo
    restart: always
    environment:
      POSTGRES_DB: meteo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: meteo123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
